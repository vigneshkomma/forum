<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Access denied · Forum</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<footer th:replace="~{fragments/footer :: footer}"></footer>

</html>
