<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign up · Forum</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<main class="auth-wrap">
    <div class="auth-card">
        <h1>Create your account</h1>
        <p class="muted">Join the conversation in a few seconds.</p>

        <form th:action="@{/register}" method="post" th:object="${form}">
            <div class="alert alert-error" th:if="${#fields.hasGlobalErrors()}">
                <p th:each="error : ${#fields.globalErrors()}" th:text="${error}">Error</p>
            </div>

            <label for="username">Username</label>
            <input type="text" id="username" th:field="*{username}" autocomplete="username"
                   placeholder="jane_doe" maxlength="30" autofocus>
            <p class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">error</p>

            <label for="email">Email</label>
            <input type="email" id="email" th:field="*{email}" autocomplete="email"
                   placeholder="jane@example.com" maxlength="255">
            <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">error</p>

            <label for="displayName">Display name <span class="optional">(optional)</span></label>
            <input type="text" id="displayName" th:field="*{displayName}"
                   placeholder="Jane Doe" maxlength="50">
            <p class="field-error" th:if="${#fields.hasErrors('displayName')}" th:errors="*{displayName}">error</p>

            <label for="password">Password</label>
            <input type="password" id="password" th:field="*{password}"
                   autocomplete="new-password" placeholder="At least 8 characters" maxlength="72">
            <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">error</p>

            <button class="btn btn-primary btn-block" type="submit">Create account</button>
        </form>

        <p class="auth-alt">Already have an account? <a th:href="@{/login}">Log in</a></p>
    </div>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
