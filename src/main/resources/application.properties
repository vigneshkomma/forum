spring.application.name=forum

# Local secrets live in .env (git-ignored). See .env.example.
spring.config.import=optional:file:./.env[.properties]

# Defaults; override via .env or environment variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/forum}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Flyway owns the schema; Hibernate only checks that entities match
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# Templates are re-read on every request during development
spring.thymeleaf.cache=false
